      <div class="brand-txt">
        <h1>葡萄酒工程学虚拟实验系统</h1>
        <p>工程学实验 · 实拍参考环境 v0.6</p>
      </div>
    </div>
    <nav class="modes" id="modes" aria-label="实验模式">
      <button data-mode="task" class="on" aria-pressed="true">任务模式</button>
      <button data-mode="free" aria-pressed="false">自由探索</button>
    </nav>
    <div class="head-actions">
      <button id="btn-tasks" class="ghost icon-btn" aria-label="实验任务" aria-controls="left" aria-expanded="true" data-tip="实验任务"><span data-icon="panelLeft"></span></button>
      <button id="btn-assistant" class="ghost icon-btn" aria-label="AI 助教" aria-controls="right" aria-expanded="true" data-tip="AI 助教"><span data-icon="messagesSquare"></span></button>
      <span class="toolbar-separator"></span>
      <button id="btn-view" class="ghost view-btn" aria-label="切换为环绕视角" data-tip="切换为环绕视角"><span data-icon="orbit"></span><span>环绕视角</span></button>
      <select id="graphics-quality" class="ghost" aria-label="画质" title="画质">
        <option value="auto">画质 · 自动</option>
        <option value="high">画质 · 精细</option>
        <option value="smooth">画质 · 流畅</option>
      </select>
      <button id="btn-teacher" class="ghost icon-btn" aria-label="教师端" data-tip="教师端"><span data-icon="graduationCap"></span></button>
      <button id="btn-mute" class="ghost icon-btn mute-btn" aria-label="关闭音效" data-tip="关闭音效"><span data-icon="volume2"></span></button>
      <button id="btn-help" class="ghost icon-btn" aria-label="操作说明" data-tip="操作说明"><span data-icon="circleHelp"></span></button>
      <button id="btn-reset" class="ghost icon-btn" aria-label="重置批次" data-tip="重置批次"><span data-icon="rotateCcw"></span></button>
    </div>
  </header>

  <main>
    <aside id="left" aria-label="实验任务与工艺时间">
      <section class="panel task-panel">
        <div class="panel-head">
          <h2>实验任务</h2>
          <span id="task-count" class="badge">0 / 11</span>
        </div>
        <div class="wine-route">
          <label for="wine-type">酿造路线</label>
          <select id="wine-type" aria-label="酿造路线">
            <option value="red">红葡萄酒 · 带皮发酵后压榨</option>
            <option value="white">白葡萄酒 · 发酵前压榨取汁</option>
          </select>
          <p id="route-note">红葡萄酒：葡萄醪入罐，带皮发酵后分离、压榨。</p>
        </div>
        <div class="progress" id="task-progress" role="progressbar" aria-label="任务完成进度" aria-valuemin="0" aria-valuemax="11" aria-valuenow="0"><i id="task-bar"></i></div>
        <ol id="steps" class="steps"></ol>
      </section>

      <section class="panel time-panel">
        <div class="panel-head">
          <h2>工艺时间</h2>
          <span class="badge" id="day-badge">第 0 天</span>
        </div>
        <div class="time-row">
          <button id="btn-advance" class="wide"><span data-icon="fastForward"></span><span>推进 24 小时</span></button>
          <button id="btn-advance3" class="ghost narrow" title="推进 3 天" aria-label="推进 3 天">+3 天</button>
        </div>
        <div id="risk" class="risk"></div>
        <div class="curve-head"><h3>发酵曲线</h3><button id="btn-samples" class="ghost icon-btn" aria-label="取样记录" data-tip="取样记录"><span data-icon="table"></span></button></div>
        <canvas id="curve" width="460" height="244" role="img" aria-label="发酵曲线，暂无取样数据"></canvas>
      </section>
    </aside>

    <div id="stage">
      <div id="viewport"></div>

      <div id="objective" class="hidden"><b>任务</b><span></span></div>
      <div id="fly-badge" class="hidden"><b>飞行</b><span><kbd>空格</kbd> 上升 · <kbd>Shift</kbd> 下降 · 双击 <kbd>空格</kbd> 落地</span></div>
      <div id="crosshair"><i></i></div>
      <div id="prompt" class="hidden"><kbd>E</kbd><span></span></div>
      <div id="waypoint" class="hidden"><i></i><span></span></div>
      <div id="card" class="hidden"></div>
      <div id="toast-wrap" role="status" aria-live="polite"></div>

      <div id="overlay">
        <div class="overlay-card">
          <span class="overlay-label">葡萄酒工程学 · 实验车间</span>
          <h2 id="ovl-title">准备开始实验</h2>
          <p id="ovl-desc">原料验收与除梗破碎</p>
          <button id="ovl-enter" class="primary-lg">进入车间</button>
          <button id="ovl-orbit" class="ghost">环绕查看</button>
        </div>
      </div>
    </div>

    <aside id="right" aria-label="AI 助教与部件详情">
      <section id="asm" class="panel hidden"></section>
      <section class="panel chat">
        <div class="panel-head">
          <h2>AI 助教</h2>
          <span id="ai-badge" class="badge">DeepSeek</span>
        </div>
        <div id="chat" class="chat-body" role="log" aria-label="助教对话" aria-live="polite"></div>
        <div class="chat-input">
          <input id="q" aria-label="向助教提问" placeholder="输入工艺问题…" autocomplete="off" />
          <button id="send" class="icon-btn" aria-label="发送问题" data-tip="发送问题"><span data-icon="send"></span></button>
        </div>
        <div id="ai-mode" class="ai-mode"></div>
      </section>
    </aside>
  </main>

  <footer id="hud">
    <div class="chip"><label>罐温</label><b id="hud-temp">–</b></div>
    <div class="chip"><label>糖度</label><b id="hud-brix">–</b></div>
    <div class="chip"><label>残糖</label><b id="hud-rs">–</b></div>
    <div class="chip"><label>酒度</label><b id="hud-eth">–</b></div>
    <div class="chip"><label>总 SO₂</label><b id="hud-so2">–</b></div>
    <div class="chip"><label>状态</label><b id="hud-state">待开始</b></div>
    <div class="chip"><label>质量分</label><b id="hud-score">100</b></div>
    <div class="spacer"></div>
    <div class="hud-note">教学原型 · 参数为课程参考值</div>
  </footer>
</div>

<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"></div></div>

<script src="./app.js"></script>
</body>
</html>
